name: Publish

env:
  NPM_REGISTRY_PATH: //api.backup.wadeck.ch/npm

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Compute version
        id: version
        run: bash ci/scripts/compute-version.sh

      - name: Set package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - run: npm run build

      - run: npm test

      - name: Configure npm auth for publish
        run: |
          echo "registry=https:${NPM_REGISTRY_PATH}" > ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc
          echo "${NPM_REGISTRY_PATH}/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WDRIVE_NPM_TOKEN }}

      - name: Publish
        run: npm publish --tag ${{ steps.version.outputs.npm_tag }}
