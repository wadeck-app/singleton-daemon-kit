name: Publish

env:
  GITLAB_NPM_REGISTRY_PATH: //gitlab.com/api/v4/projects/84445653/packages/npm/

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version (e.g. 1.2.0)'
        required: false
        default: ''
      breaking:
        description: 'Breaking change? (true/false)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Compute version
        id: version
        run: bash ci/scripts/compute-version.sh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          BREAKING_INPUT: ${{ github.event.inputs.breaking }}

      - name: Set package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - run: npm run build

      - run: npm test

      - name: Configure auth for GitLab npm registry
        run: |
          # Trim whitespace and validate token format
          TOKEN=$(echo "${GITLAB_NPM_WRITE_TOKEN}" | tr -d '[:space:]')
          if [ -z "$TOKEN" ]; then
            echo "ERROR: GITLAB_NPM_WRITE_TOKEN is empty after trim"
            exit 1
          fi
          if [[ "$TOKEN" != gldt-* ]]; then
            echo "ERROR: GITLAB_NPM_WRITE_TOKEN does not start with 'gldt-'"
            exit 1
          fi
          echo "=== Token preview: ${TOKEN:0:9}*** ==="

          echo "@wadeck:registry=https:${GITLAB_NPM_REGISTRY_PATH}" >> .npmrc
          echo "${GITLAB_NPM_REGISTRY_PATH}:_authToken=${TOKEN}" >> .npmrc
          echo "auth-type=legacy" >> .npmrc
          echo "=== .npmrc (token masked) ===" && sed 's/_authToken=.*/_authToken=***/' .npmrc
          echo "=== whoami ===" && curl -s "https:${GITLAB_NPM_REGISTRY_PATH}-/whoami" -H "Authorization: Bearer ${TOKEN}"
          echo ""
        env:
          GITLAB_NPM_WRITE_TOKEN: ${{ secrets.GITLAB_NPM_WRITE_TOKEN }}

      - name: Publish
        run: |
          set +e
          npm publish --tag ${{ steps.version.outputs.npm_tag }}
          EXIT=$?
          set -e
          if [ $EXIT -ne 0 ]; then
            echo "=== NPM DEBUG LOG (publish only) ==="
            ls -t /home/runner/.npm/_logs/*.log | head -1 | xargs cat
            exit $EXIT
          fi
