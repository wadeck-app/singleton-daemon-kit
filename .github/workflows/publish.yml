name: Publish

env:
  NPM_REGISTRY_URL: https://api.backup.wadeck.ch/npm

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Compute version
        id: version
        run: bash ci/scripts/compute-version.sh

      - name: Set package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - run: npm run build

      - run: npm test

      - name: Configure auth for private registry
        run: |
          echo "//api.backup.wadeck.ch/npm/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          echo "=== project .npmrc (token masked) ===" && sed 's/_authToken=.*/_authToken=***/' .npmrc
          echo "=== ping ===" && curl -s -o /dev/null -w "%{http_code}" "${NPM_REGISTRY_URL}/-/ping" && echo ""
          echo "=== whoami ===" && curl -s "${NPM_REGISTRY_URL}/-/whoami" -H "Authorization: Bearer ${NODE_AUTH_TOKEN}"
          echo ""
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WDRIVE_NPM_TOKEN }}

      - name: Publish
        run: |
          echo "=== npm config list ==="
          npm config list
          echo "=== npm config get registry ==="
          npm config get registry
          echo "=== .npmrc files npm finds ==="
          npm config ls -l 2>&1 | grep -i "npmrc\|userconfig\|globalconfig\|builtin"
          echo "=== attempt publish with --loglevel verbose ==="
          npm publish --tag ${{ steps.version.outputs.npm_tag }} --loglevel verbose 2>&1 | grep -E "auth|token|registry|PUT|401|403|ENEED" || true
          npm publish --tag ${{ steps.version.outputs.npm_tag }}
