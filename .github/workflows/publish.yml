name: CI / Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version (e.g. 1.2.0)'
        required: false
        default: ''
      breaking:
        description: 'Breaking change? (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wadeck-app'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run check

  go-test:
    # The tests are platform specific (real Ctrl+Break on Windows, real SIGTERM on Unix), so each OS runs its own.
    strategy:
      # Let the other OSes finish: a Windows-only failure should not hide a macOS one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Same version rule as the module: reads the `go` and `toolchain` lines of go.mod, so CI cannot drift from it.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-launcher/go.mod
          cache-dependency-path: go-launcher/go.sum

      # buildsh_test.go runs build.sh, which calls `node` to parse its JSON config; bash itself comes with each runner.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The module lives in go-launcher/, not at the repository root.
      - run: go test ./...
        working-directory: go-launcher

  publish:
    # Both jobs block the publish: a Go regression must not ship.
    needs: [build-and-test, go-test]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wadeck-app'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        uses: wadeck-app/ci-templates/.github/actions/compute-version@main
        with:
          version-input: ${{ github.event.inputs.version || '' }}
          breaking-input: ${{ github.event.inputs.breaking || 'false' }}

      - name: Set package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - run: npm run build

      - name: Configure auth for GitHub Packages
        run: |
          echo "@wadeck-app:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          npm publish --tag ${{ steps.version.outputs.dist_tag }}
          EXIT=$?
          set -e
          if [ $EXIT -ne 0 ]; then
            echo "=== NPM DEBUG LOG (publish only) ==="
            ls -t /home/runner/.npm/_logs/*.log | head -1 | xargs cat
            exit $EXIT
          fi
